<div id="delete-modal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px);">
    <div style="background: var(--bg-secondary); border-radius: 1rem; padding: 2rem; max-width: 400px; width: 90%; text-align: center; border: 1px solid #dc3545;">
        
        <div style="font-size: 4rem; margin-bottom: 1rem;">⚠️</div>
        <h2 style="color: #dc3545; margin-bottom: 1rem;">Confirmar Exclusão</h2>
        <p style="color: var(--text-secondary); margin-bottom: 0.5rem;">
            Tem certeza que deseja excluir esta transação?
        </p>
        <p style="color: var(--text-primary); font-weight: bold; margin-bottom: 1.5rem;">
            "{{ transaction.description }}" - {{ transaction.amount|floatformat:2 }} MZN
        </p>
        
        <div style="display: flex; gap: 1rem;">
            <form hx-post="{% url 'financas:delete_transaction' transaction.id %}" 
                  hx-target="#delete-modal" 
                  hx-swap="outerHTML"
                  style="flex: 1;">
                {% csrf_token %}
                <button type="submit" style="width: 100%; background: #dc3545; color: white; border: none; padding: 0.75rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; font-size: 1rem;">
                    🗑️ Sim, Excluir
                </button>
            </form>
            <button onclick="this.closest('#delete-modal').remove()" class="btn-secondary" style="flex: 1;">
                ❌ Cancelar
            </button>
        </div>
    </div>
</div>
