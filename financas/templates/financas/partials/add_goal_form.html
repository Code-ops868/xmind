<div id="add-goal-modal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px);">
    <div style="background: var(--bg-secondary); border-radius: 1rem; padding: 2rem; max-width: 500px; width: 90%; border: 1px solid var(--gold-primary); max-height: 90vh; overflow-y: auto;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2 style="color: var(--gold-primary); margin: 0;">🎯 Nova Meta</h2>
            <button onclick="fecharModalMeta()" 
                    style="background: none; border: none; font-size: 2rem; cursor: pointer; color: var(--text-secondary);">&times;</button>
        </div>
        
        {% if error %}
        <div style="background: rgba(220,53,69,0.2); border-left: 4px solid #dc3545; padding: 0.75rem; border-radius: 0.5rem; margin-bottom: 1rem; color: #dc3545;">
            ❌ {{ error }}
        </div>
        {% endif %}
        
        <form id="goal-form" 
              hx-post="{% url 'financas:add_goal' %}" 
              hx-target="#goals-content"
              hx-swap="innerHTML"
              hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
              hx-on::after-request="fecharModalMeta()">
            {% csrf_token %}
            
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--gold-primary);">📅 Mês de Referência</label>
                {{ form.month }}
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: #28a745;">📈 Meta de Entradas (MZN)</label>
                {{ form.goal_entradas }}
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: #dc3545;">📉 Meta de Saídas (MZN)</label>
                {{ form.goal_saidas }}
            </div>
            
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--gold-primary);">💰 Meta de Saldo (MZN)</label>
                {{ form.goal_saldo }}
            </div>
            
            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn-primary" style="flex: 1;">💾 Salvar Meta</button>
                <button type="button" onclick="fecharModalMeta()" class="btn-secondary" style="flex: 1;">❌ Cancelar</button>
            </div>
        </form>
    </div>
</div>

<style>
    .form-control {
        width: 100%;
        padding: 0.75rem;
        background: var(--bg-tertiary);
        border: 2px solid var(--orange-soft);
        color: var(--text-primary);
        border-radius: 0.5rem;
        font-size: 1rem;
    }
    .form-control:focus {
        border-color: var(--gold-primary);
        outline: none;
        box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
    }
    input[type="month"] {
        background-color: var(--bg-tertiary);
        border: 2px solid var(--orange-soft);
        color: var(--text-primary);
        padding: 0.75rem;
        border-radius: 0.5rem;
        width: 100%;
        font-size: 1rem;
    }
    input[type="month"]:focus {
        border-color: var(--gold-primary);
        outline: none;
        box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
    }
    input[type="number"] {
        background-color: var(--bg-tertiary);
        border: 2px solid var(--orange-soft);
        color: var(--text-primary);
        padding: 0.75rem;
        border-radius: 0.5rem;
        width: 100%;
        font-size: 1rem;
    }
    input[type="number"]:focus {
        border-color: var(--gold-primary);
        outline: none;
        box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
    }
</style>

<script>
function fecharModalMeta() {
    const modal = document.getElementById('add-goal-modal');
    if (modal) {
        modal.remove();
    }
}
</script>
